# Push main → SSH VPS → pull BE + rebuild container be
name: Deploy BE to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-vps-be
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ~/flourish

            if [ -d BE/.git ]; then
              cd BE
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
              cd ..
            else
              echo "BE/.git not found"
              exit 1
            fi

            docker compose up -d --build --force-recreate be
            docker compose ps be
            curl -sf http://127.0.0.1:8080/health || curl -sf http://127.0.0.1:8080/actuator/health
            echo "BE deploy OK"
