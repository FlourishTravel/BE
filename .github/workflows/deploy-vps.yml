# Build image on GitHub (2-core VPS cannot run Maven). VPS only docker load + start.
name: Deploy BE to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-vps-be
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image on GitHub
        run: docker build -t flourish-be:gha .

      - name: Save image
        run: docker save flourish-be:gha | gzip -1 > flourish-be.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: flourish-be.tar.gz
          target: /tmp
          timeout: 600s
          overwrite: true

      - name: Load image and start API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            mkdir -p /var/lock
            exec 9>/var/lock/flourish-deploy.lock
            flock -w 900 9

            cd ~/flourish

            echo "=== stop Maven/buildkit on the 2-core VPS ==="
            docker ps --format '{{.ID}} {{.Image}}' | grep -iE 'maven|buildkit|moby/buildkit' | awk '{print $1}' | xargs -r docker stop || true

            find /var/lib/docker/containers -name '*-json.log' -exec truncate -s 0 {} \; 2>/dev/null || true
            df -h /

            echo "=== docker load (no Maven on VPS) ==="
            gzip -dc /tmp/flourish-be.tar.gz | docker load
            docker tag flourish-be:gha flourish-be:latest
            docker tag flourish-be:gha flourish-be
            docker tag flourish-be:gha flourish-be-be:latest || true
            docker tag flourish-be:gha flourish_be:latest || true
            docker compose config --images 2>/dev/null | grep -i be | while read -r img; do
              docker tag flourish-be:gha "$img" || true
            done
            rm -f /tmp/flourish-be.tar.gz

            if [ -d BE/.git ]; then
              cd BE
              git fetch origin || true
              git reset --hard origin/main || git reset --hard origin/master || true
              cd ..
            fi

            touch .env
            grep -q '^API_BASE_URL=' .env \
              && sed -i 's|^API_BASE_URL=.*|API_BASE_URL=https://flourishtravelapp.khanhtn45.id.vn/api|' .env \
              || echo 'API_BASE_URL=https://flourishtravelapp.khanhtn45.id.vn/api' >> .env

            grep -q '^MAIL_ENABLED=' .env || echo 'MAIL_ENABLED=false' >> .env
            grep -q '^MAIL_HOST=' .env || echo 'MAIL_HOST=smtp.gmail.com' >> .env
            grep -q '^MAIL_PORT=' .env || echo 'MAIL_PORT=587' >> .env
            grep -q '^MAIL_USERNAME=' .env || echo 'MAIL_USERNAME=' >> .env
            grep -q '^MAIL_PASSWORD=' .env || echo 'MAIL_PASSWORD=' >> .env
            grep -q '^MAIL_FROM=' .env || echo 'MAIL_FROM=' >> .env

            if ! grep -q 'API_BASE_URL' docker-compose.yml; then
              sed -i '/FRONTEND_URL: \${FRONTEND_URL}/a\      API_BASE_URL: ${API_BASE_URL}' docker-compose.yml
            fi
            if grep -q 'FRONTEND_URL: \${FRONTEND_URL}' docker-compose.yml; then
              for key in MAIL_ENABLED MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_PASSWORD MAIL_FROM; do
                if ! grep -q "${key}:" docker-compose.yml; then
                  sed -i "/FRONTEND_URL: \${FRONTEND_URL}/a\\      ${key}: \${${key}:-}" docker-compose.yml
                fi
              done
            fi

            pg_ok=0
            for i in $(seq 1 40); do
              if docker compose exec -T postgres pg_isready -q 2>/dev/null \
                || docker compose exec -T db pg_isready -q 2>/dev/null; then
                pg_ok=1
                break
              fi
              echo "Waiting for PostgreSQL... ($i/40)"
              sleep 3
            done
            if [ "$pg_ok" != "1" ]; then
              echo "PostgreSQL is not ready"
              docker compose ps
              docker compose logs postgres --tail 40 2>/dev/null || docker compose logs db --tail 40 2>/dev/null || true
              exit 1
            fi

            docker compose up -d --no-build --force-recreate be
            docker compose ps be
            docker image prune -f || true

            ok=0
            for i in $(seq 1 50); do
              if curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1 \
                || curl -sf http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
                ok=1
                break
              fi
              echo "Waiting for BE health... ($i/50)"
              sleep 3
            done
            if [ "$ok" != "1" ]; then
              echo "BE health check failed"
              df -h /
              docker compose ps
              docker compose logs be --tail 80
              exit 1
            fi
            echo "BE deploy OK"
