# Push main → SSH VPS → pull BE + rebuild container be
name: Deploy BE to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-vps-be
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ~/flourish

            echo "=== disk before cleanup ==="
            df -h /
            docker system df || true
            # Do not prune volumes — that would wipe Postgres data.
            find /var/lib/docker/containers -name '*-json.log' -exec truncate -s 0 {} \; 2>/dev/null || true
            docker container prune -f || true
            docker builder prune -af || true
            docker image prune -af || true
            docker system prune -af || true
            journalctl --vacuum-size=50M || true
            apt-get clean || true
            find /var/log -type f \( -name "*.log" -o -name "*.gz" \) -size +10M -exec truncate -s 0 {} \; 2>/dev/null || true
            truncate -s 0 /var/log/nginx/access.log /var/log/nginx/error.log 2>/dev/null || true
            if [ -d FE/.git ]; then
              git -C FE gc --prune=now || true
            fi
            echo "=== disk after cleanup ==="
            df -h /
            docker compose restart db 2>/dev/null || docker compose restart postgres 2>/dev/null || true
            sleep 8

            if [ -d BE/.git ]; then
              cd BE
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
              cd ..
            else
              echo "BE/.git not found"
              exit 1
            fi

            # Public URL cho upload/media (tránh lưu http://localhost:8080 vào DB)
            touch .env
            grep -q '^API_BASE_URL=' .env \
              && sed -i 's|^API_BASE_URL=.*|API_BASE_URL=https://flourishtravelapp.khanhtn45.id.vn/api|' .env \
              || echo 'API_BASE_URL=https://flourishtravelapp.khanhtn45.id.vn/api' >> .env

            grep -q '^MAIL_ENABLED=' .env || echo 'MAIL_ENABLED=false' >> .env
            grep -q '^MAIL_HOST=' .env || echo 'MAIL_HOST=smtp.gmail.com' >> .env
            grep -q '^MAIL_PORT=' .env || echo 'MAIL_PORT=587' >> .env
            grep -q '^MAIL_USERNAME=' .env || echo 'MAIL_USERNAME=' >> .env
            grep -q '^MAIL_PASSWORD=' .env || echo 'MAIL_PASSWORD=' >> .env
            grep -q '^MAIL_FROM=' .env || echo 'MAIL_FROM=' >> .env

            if ! grep -q 'API_BASE_URL' docker-compose.yml; then
              sed -i '/FRONTEND_URL: \${FRONTEND_URL}/a\      API_BASE_URL: ${API_BASE_URL}' docker-compose.yml
            fi
            if grep -q 'FRONTEND_URL: \${FRONTEND_URL}' docker-compose.yml; then
              for key in MAIL_ENABLED MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_PASSWORD MAIL_FROM; do
                if ! grep -q "${key}:" docker-compose.yml; then
                  sed -i "/FRONTEND_URL: \${FRONTEND_URL}/a\\      ${key}: \${${key}:-}" docker-compose.yml
                fi
              done
            fi

            # BE must not start while Postgres is still in crash recovery (57P03).
            pg_ok=0
            for i in $(seq 1 60); do
              if docker compose exec -T postgres pg_isready -q 2>/dev/null \
                || docker compose exec -T db pg_isready -q 2>/dev/null; then
                pg_ok=1
                break
              fi
              echo "Waiting for PostgreSQL... ($i/60)"
              sleep 3
            done
            if [ "$pg_ok" != "1" ]; then
              echo "PostgreSQL is not ready (still recovering or down)"
              docker compose ps
              docker compose logs postgres --tail 40 2>/dev/null || docker compose logs db --tail 40 2>/dev/null || true
              exit 1
            fi

            docker compose up -d --build --force-recreate be
            docker compose ps be
            docker image prune -af || true
            find /var/lib/docker/containers -name '*-json.log' -exec truncate -s 0 {} \; 2>/dev/null || true

            # Spring Boot cần ~20–40s sau recreate; đĩa chậm thì lâu hơn
            ok=0
            for i in $(seq 1 60); do
              if curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1 \
                || curl -sf http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
                ok=1
                break
              fi
              echo "Waiting for BE health... ($i/60)"
              sleep 3
            done
            if [ "$ok" != "1" ]; then
              echo "BE health check failed"
              df -h /
              docker compose ps
              docker compose logs be --tail 80
              docker compose logs db --tail 30 2>/dev/null || docker compose logs postgres --tail 30 2>/dev/null || true
              exit 1
            fi
            echo "BE deploy OK"
